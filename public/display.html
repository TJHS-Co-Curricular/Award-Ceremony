<title>Award Display</title>
<style>
:root{
  --bg:#07060c; --ink:#f6f1e4; --muted:#b9ad92; --gold:#d9b25f; --gold-hi:#f7e2a6; --gold-lo:#9a7330;
  --serif:"Noto Serif SC","Source Han Serif SC","Source Han Serif CN","Songti SC","STSong","Microsoft YaHei",serif;
  --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--sans)}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:
    radial-gradient(1200px 700px at 50% 38%, rgba(217,178,95,.16), transparent 70%),
    radial-gradient(900px 500px at 50% 110%, rgba(120,40,40,.28), transparent 70%),
    linear-gradient(#0c0a14,#05040a);}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:20}
.frame{position:absolute;inset:36px;border:1px solid rgba(217,178,95,.22);pointer-events:none;z-index:5}
.frame::before,.frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(217,178,95,.10)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .9s ease, visibility 0s linear .9s;z-index:10}
.scene.active{opacity:1;visibility:visible;transition:opacity .9s ease}
.goldtext{background:linear-gradient(100deg,var(--gold-lo) 0%,var(--gold) 25%,var(--gold-hi) 45%,var(--gold) 60%,var(--gold-lo) 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-130% 0}}
.ornament{display:flex;align-items:center;gap:22px;color:var(--gold)}
.ornament i{display:block;height:1px;width:260px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.ornament b{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--gold)}
.kicker{font-size:30px;letter-spacing:.6em;padding-left:.6em;color:var(--muted);text-transform:uppercase}

/* 待机 */
#s-standby h1{font-family:var(--serif);font-weight:800;font-size:150px;letter-spacing:.08em;line-height:1.2;text-align:center;max-width:calc(100% - 220px);margin:44px 0 28px}
#s-standby .sub{font-size:40px;letter-spacing:.5em;padding-left:.5em;color:var(--muted);margin-top:30px}

/* 奖项标题 */
#s-title .kicker{margin-bottom:46px}
#s-title h2{font-family:var(--serif);font-weight:800;font-size:180px;letter-spacing:.06em;line-height:1.15;text-align:center;max-width:calc(100% - 160px)}
#s-title .sub{font-size:44px;color:var(--muted);letter-spacing:.2em;margin-top:34px}
#s-title .soon{margin-top:80px;font-size:32px;letter-spacing:.8em;padding-left:.8em;color:var(--gold);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.spot{position:absolute;top:-10%;width:900px;height:120%;background:radial-gradient(closest-side,rgba(247,226,166,.10),transparent);filter:blur(10px);animation:sweep 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes sweep{from{left:-20%}to{left:70%}}
.scene.enter h2,.scene.enter h1{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both, shimmer 7s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

/* 揭晓 */
#s-reveal{justify-content:flex-start;padding:84px 110px 90px}
#s-reveal header{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:34px;flex:none}
#s-reveal header h3{font-family:var(--serif);font-weight:800;font-size:84px;letter-spacing:.08em;line-height:1.15;text-align:center}
#s-reveal header .sub{font-size:28px;color:var(--muted);letter-spacing:.25em}
#grid{flex:1;width:100%;display:grid;gap:var(--gap,28px);align-content:center;justify-content:center;min-height:0}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:18px 20px;border-radius:6px;min-width:0;min-height:0;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid rgba(217,178,95,.35);box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)}
.card::after{content:"";position:absolute;inset:6px;border:1px solid rgba(217,178,95,.12);border-radius:3px;pointer-events:none}
.card .ph{flex:none;height:var(--ph,300px);aspect-ratio:var(--ar,16/9);width:auto;border-radius:4px;object-fit:cover;margin-bottom:var(--phgap,14px);border:2px solid rgba(217,178,95,.6);background:rgba(255,255,255,.04)}
.card .tx{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
#grid.photo .card{padding:var(--pad,18px)}
#grid.h .card{flex-direction:row;justify-content:flex-start;text-align:left}
#grid.h .card .ph{margin:0 var(--phgap,14px) 0 0}
#grid.h .card .tx{flex:1;align-items:flex-start}
#grid.h .card.hidden{justify-content:center}
#grid.nophoto .card .ph{display:none}
#s-reveal.dense{padding-top:60px;padding-bottom:64px}
#s-reveal.dense header{margin-bottom:18px;gap:4px}
#s-reveal.dense header h3{font-size:60px}
#s-reveal.dense header .sub{font-size:22px}
.card .nm{font-weight:800;font-size:var(--name,72px);line-height:1.2;letter-spacing:.06em;color:var(--ink);white-space:nowrap;max-width:100%}
.card .dt{font-size:var(--detail,30px);color:var(--muted);margin-top:.45em;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card.hidden{border-style:dashed;border-color:rgba(217,178,95,.22);background:rgba(255,255,255,.015);box-shadow:none}
.card.hidden .q{font-family:var(--serif);font-size:calc(var(--name,72px) * 1.1);color:rgba(217,178,95,.35);animation:pulse 2.4s ease-in-out infinite}
.card.pop{animation:pop 1.1s cubic-bezier(.2,.8,.2,1) both}
.card.pop::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.45) 50%,transparent 70%);transform:translateX(-120%);animation:glint 1.4s .35s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotateX(70deg);filter:blur(10px)}60%{opacity:1;transform:scale(1.04);filter:none}100%{transform:none}}
@keyframes glint{to{transform:translateX(120%)}}
.single .card{border-color:rgba(217,178,95,.6)}

/* 消息 */
#s-message p{font-family:var(--serif);font-weight:700;font-size:110px;line-height:1.35;text-align:center;max-width:calc(100% - 270px);letter-spacing:.06em;white-space:pre-wrap}
#s-message .ornament{margin-top:60px}

#black{position:absolute;inset:0;background:#000;z-index:50;opacity:0;pointer-events:none;transition:opacity .7s ease}
#black.on{opacity:1}
#conn{position:fixed;right:10px;bottom:10px;width:10px;height:10px;border-radius:50%;background:#e04848;z-index:100;opacity:0;transition:opacity .3s}
#conn.show{opacity:.85}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="frame"></div>

  <section class="scene" id="s-standby">
    <div class="ornament"><i></i><b></b><i></i></div>
    <h1 class="goldtext" id="evTitle"></h1>
    <div class="ornament"><i></i><b></b><i></i></div>
    <div class="sub" id="evSub"></div>
  </section>

  <section class="scene" id="s-title">
    <div class="spot"></div>
    <div class="kicker">颁 发 奖 项</div>
    <h2 class="goldtext" id="tTitle"></h2>
    <div class="sub" id="tSub"></div>
    <div class="soon" id="tSoon">即 将 揭 晓</div>
  </section>

  <section class="scene" id="s-reveal">
    <header>
      <h3 class="goldtext" id="rTitle"></h3>
      <div class="sub" id="rSub"></div>
    </header>
    <div id="grid"></div>
  </section>

  <section class="scene" id="s-message">
    <p id="msg"></p>
    <div class="ornament"><i></i><b></b><i></i></div>
  </section>

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="black"></div>
</div>
<div id="conn" title="连接中断，正在重连"></div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const KEY = qs.get('k') || '';
  const PREVIEW = qs.get('preview') === '1';
  const $ = id => document.getElementById(id);

  /* ---------- 舞台：按屏幕比例自适应 ----------
   * 以 1920×1080 为基准单位，短边固定、长边延伸：
   *   4096×1280 → 舞台 3456×1080（超宽）；1216×896 → 舞台 1920×1415（偏方）
   * 网址加 &res=宽x高 可强制比例（例如经过视频处理器、窗口大小不准时）。 */
  const stage = $('stage');
  let SW = 1920, SH = 1080, lastV = null, resizeT = 0;
  const RES = (qs.get('res') || '').match(/^(\d{2,5})x(\d{2,5})$/);
  function fit() {
    const tw = RES ? +RES[1] : innerWidth, th = RES ? +RES[2] : innerHeight;
    const s0 = Math.min(tw / 1920, th / 1080);
    const nw = Math.round(tw / s0), nh = Math.round(th / s0);
    const changed = nw !== SW || nh !== SH;
    SW = nw; SH = nh;
    stage.style.width = SW + 'px'; stage.style.height = SH + 'px';
    for (const c of document.querySelectorAll('canvas')) if (c.width !== SW || c.height !== SH) { c.width = SW; c.height = SH; }
    const s = Math.min(innerWidth / SW, innerHeight / SH);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
    if (changed && lastV) { clearTimeout(resizeT); resizeT = setTimeout(relayout, 250); }
  }
  addEventListener('resize', fit); fit();

  /* ---------- 全屏 / 隐藏鼠标 ---------- */
  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
  addEventListener('dblclick', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFs(); });
  let idleT;
  addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2000); });
  idleT = setTimeout(() => document.body.classList.add('idle'), 2000);

  /* ---------- 背景浮尘 ---------- */
  const bg = $('bg').getContext('2d');
  const dust = Array.from({ length: PREVIEW ? 30 : Math.round(90 * SW / 1920) }, () => ({
    x: Math.random() * SW, y: Math.random() * SH, r: Math.random() * 2.2 + .4,
    vy: -(Math.random() * .25 + .05), vx: (Math.random() - .5) * .15, a: Math.random() * .5 + .1, t: Math.random() * 6.28
  }));
  (function drawBg() {
    bg.clearRect(0, 0, SW, SH);
    for (const d of dust) {
      d.x += d.vx; d.y += d.vy; d.t += .02;
      if (d.y < -10 || d.x > SW + 10) { d.y = SH + 10; d.x = Math.random() * SW; }
      bg.globalAlpha = d.a * (.6 + .4 * Math.sin(d.t));
      bg.fillStyle = '#f2d48a';
      bg.beginPath(); bg.arc(d.x, d.y, d.r, 0, 6.283); bg.fill();
    }
    requestAnimationFrame(drawBg);
  })();

  /* ---------- 彩带 ---------- */
  const fx = $('fx').getContext('2d');
  const COLORS = ['#f7e2a6', '#d9b25f', '#b8862f', '#ffffff', '#f3c86b', '#c9a24d'];
  let parts = [], running = false;
  function burst(n = 160) {
    if (PREVIEW) n = Math.round(n / 3); else n = Math.round(n * Math.max(1, SW / 1920));
    for (let side = 0; side < 2; side++) for (let i = 0; i < n / 2; i++) {
      const ang = (side ? -1 : 1) * (Math.random() * .5 + .35) - Math.PI / 2 + (side ? 0 : 0);
      const sp = (Math.random() * 22 + 14) * Math.sqrt(SH / 1080);
      parts.push({
        x: side ? SW : 0, y: SH, vx: Math.cos(ang) * sp * (side ? 1 : 1), vy: Math.sin(ang) * sp,
        w: Math.random() * 10 + 6, h: Math.random() * 6 + 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: COLORS[(Math.random() * COLORS.length) | 0], life: 0, tilt: Math.random() * 6
      });
    }
    if (!running) { running = true; requestAnimationFrame(stepFx); }
  }
  function stepFx() {
    fx.clearRect(0, 0, SW, SH);
    parts = parts.filter(p => p.y < SH + 70 && p.life < 420);
    for (const p of parts) {
      p.life++; p.vy += .32; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.tilt += .1;
      fx.save(); fx.translate(p.x, p.y); fx.rotate(p.rot); fx.scale(1, Math.cos(p.tilt));
      fx.fillStyle = p.c; fx.globalAlpha = Math.min(1, (420 - p.life) / 60);
      fx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fx.restore();
    }
    if (parts.length) requestAnimationFrame(stepFx); else { running = false; fx.clearRect(0, 0, SW, SH); }
  }

  /* ---------- 渲染 ---------- */
  let cur = { mode: null, awardId: null, shown: 0, total: 0 };
  function show(id) {
    for (const s of document.querySelectorAll('.scene')) {
      const on = s.id === id;
      if (on && !s.classList.contains('active')) { s.classList.remove('enter'); void s.offsetWidth; s.classList.add('enter'); }
      s.classList.toggle('active', on);
    }
  }
  /* 无照片：选出让名字最大的行列数 */
  function planText(n, W, H) {
    let best = null;
    const cap = n === 1 ? 150 : n <= 3 ? 110 : 96;
    for (let cols = 1; cols <= Math.min(n, 16); cols++) {
      const rows = Math.ceil(n / cols);
      const gap = n > 40 ? 12 : n > 12 ? 16 : n > 8 ? 22 : 30;
      const cw = Math.min((W - (cols - 1) * gap) / cols, n === 1 ? 1100 : n === 2 ? 760 : n === 3 ? 560 : 1e9);
      const ch = Math.min((H - (rows - 1) * gap) / rows, n <= 3 ? 380 : 1e9);
      const pad = Math.max(6, Math.min(20, Math.min(cw, ch) * .07));
      const name = Math.min((cw - 2 * pad) / 4.8, (ch - 2 * pad) / 2.1, cap);
      if (name < 11) continue;
      const score = name - Math.abs(Math.log(cw / ch / 2)) * 2 - (n <= 3 ? rows * 10 : rows * .01);   // 1~3 人优先排成一行   // 字号优先，其次卡片别太扁或太高
      if (!best || score > best.score) best = { cols, rows, gap, cw, ch, name, score };
    }
    return best || { cols: Math.ceil(Math.sqrt(n * 2)), rows: Math.ceil(n / Math.ceil(Math.sqrt(n * 2))), gap: 8, cw: 100, ch: 30, name: 11 };
  }
  function layout(n, photos) {
    const T = [[1,1,150,46],[2,2,104,36],[3,3,84,30],[4,2,84,30],[6,3,70,28],[8,4,60,26],[12,4,52,24],[15,5,46,22],[20,5,40,20],[30,6,34,18],[48,8,28,16],[1e9,10,22,14]];
    let [, cols, name, detail] = T.find(t => n <= t[0]);
    if (n === 4) cols = 2;
    const rows = Math.ceil(n / cols);
    if (photos) { name = Math.round(name * .85); }
    return { cols, rows, name, detail };
  }
  /* 有照片时：按人数和可用空间算出照片能放多大，并在「照片在上」和「照片在左」之间选更合适的 */
  const PHOTO_AR = 16 / 9;   // 照片框比例（宽 / 高）；原图比例不同会自动居中裁切
  document.documentElement.style.setProperty('--ar', String(PHOTO_AR));
  function planPhoto(n, W, H, minPh = 30, minName = 14) {
    let best = null;
    for (let cols = 1; cols <= Math.min(n, 16); cols++) {
      const rows = Math.ceil(n / cols);
      const gap = n > 40 ? 10 : n > 12 ? 14 : n > 6 ? 20 : 28;
      const cw = Math.min((W - (cols - 1) * gap) / cols, n === 1 ? 1000 : n === 2 ? 760 : n === 3 ? 560 : 1e9);
      const ch = (H - (rows - 1) * gap) / rows;
      if (cw < 50 || ch < 36) continue;
      const pad = Math.max(6, Math.min(22, Math.min(cw, ch) * .07));
      for (const orient of ['v', 'h']) {
        let ph, name;
        if (orient === 'v') {
          name = Math.min((cw - 2 * pad) / 4.6, ch * .16, 96);
          ph = Math.min(ch - 2 * pad - name * 2.3 - 12, (cw - 2 * pad) / PHOTO_AR, 460);
        } else {
          ph = Math.min(ch - 2 * pad, 460);
          name = Math.min((cw - 2 * pad - ph * PHOTO_AR - 14) / 4.6, ph * .32, 80);
        }
        if (ph < minPh || name < minName) continue;
        const score = ph + name * 4;   // 照片尽量大，同时名字要读得清
        if (!best || score > best.score) best = { cols, rows, gap, cw, ch, pad, orient, ph, name, score };
      }
    }
    return best;
  }
  function fitText(el) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 40;
    while (el.scrollWidth > el.clientWidth + 1 && size > 12 && guard--) { size *= .92; el.style.fontSize = size + 'px'; }
  }
  function fillCard(card, w, animate) {
    card.className = 'card' + (animate ? ' pop' : '');
    card.textContent = '';
    if (w.photo) {
      const img = document.createElement('img');
      img.className = 'ph'; img.alt = ''; img.src = w.photo + '&k=' + encodeURIComponent(KEY);
      card.appendChild(img);
    }
    const tx = document.createElement('div'); tx.className = 'tx'; card.appendChild(tx);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = w.name; tx.appendChild(nm);
    if (w.detail) { const dt = document.createElement('div'); dt.className = 'dt'; dt.textContent = w.detail; tx.appendChild(dt); }
    requestAnimationFrame(() => fitText(nm));
  }
  function buildGrid(v) {
    const grid = $('grid');
    const n = v.award.total;
    grid.textContent = '';
    grid.className = '';
    grid.removeAttribute('style');
    grid.classList.toggle('single', n === 1);
    $('s-reveal').classList.remove('dense');
    if (v.award.hasPhotos && buildPhotoGrid(grid, n)) return;
    const T = planText(n, grid.clientWidth || SW - 220, grid.clientHeight || SH - 300);
    grid.style.setProperty('--name', Math.floor(T.name) + 'px');
    grid.style.setProperty('--detail', Math.max(12, Math.floor(T.name * .38)) + 'px');
    grid.style.setProperty('--gap', T.gap + 'px');
    grid.style.gridTemplateColumns = `repeat(${T.cols}, ${Math.floor(T.cw)}px)`;
    grid.style.gridTemplateRows = `repeat(${T.rows}, ${Math.floor(n <= 3 ? Math.min(T.ch, 380) : T.ch)}px)`;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'card hidden';
      c.innerHTML = '<div class="q">?</div>';
      grid.appendChild(c);
    }
  }
  function buildPhotoGrid(grid, n) {
    const scene = $('s-reveal');
    scene.classList.toggle('dense', n > 12);
    const W = grid.clientWidth || SW - 220, H = grid.clientHeight || SH - 300;
    const P = planPhoto(n, W, H) || planPhoto(n, W, H, 22, 12);
    if (!P) { grid.classList.add('nophoto'); scene.classList.remove('dense'); return false; } // 人数实在太多：只显示名字
    grid.classList.add('photo', P.orient);
    const s = grid.style;
    s.setProperty('--ph', Math.floor(P.ph) + 'px');
    s.setProperty('--name', Math.floor(P.name) + 'px');
    s.setProperty('--detail', Math.max(11, Math.floor(P.name * .42)) + 'px');
    s.setProperty('--pad', Math.floor(P.pad) + 'px');
    s.setProperty('--phgap', Math.max(6, Math.floor(P.ph * .05)) + 'px');
    s.setProperty('--gap', P.gap + 'px');
    const rowH = P.orient === 'v' ? Math.min(P.ch, 2 * P.pad + P.ph + 12 + P.name * 2.3 + 4) : Math.min(P.ch, P.ph + 2 * P.pad);
    s.gridTemplateColumns = `repeat(${P.cols}, ${Math.floor(P.cw)}px)`;
    s.gridTemplateRows = `repeat(${P.rows}, ${Math.floor(rowH)}px)`;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'card hidden';
      c.innerHTML = '<div class="q">?</div>';
      grid.appendChild(c);
    }
    return true;
  }
  function relayout() {           // 屏幕比例变了：静默重排当前画面（不放动画）
    if (!lastV) return;
    const b = booted; booted = false; cur = { mode: null }; render(lastV); booted = b;
  }
  function render(v) {
    lastV = v;
    $('black').classList.toggle('on', !!v.blackout);
    $('evTitle').textContent = v.event?.title || '';
    $('evSub').textContent = v.event?.subtitle || '';

    if (v.mode === 'standby') { show('s-standby'); cur = { mode: 'standby' }; return; }
    if (v.mode === 'message') {
      if (cur.mode !== 'message' || $('msg').textContent !== v.message) {
        $('msg').textContent = v.message || '';
        $('s-message').classList.remove('active');
      }
      show('s-message'); cur = { mode: 'message' }; return;
    }
    if (v.mode === 'title') {
      $('tTitle').textContent = v.award.title; $('tSub').textContent = v.award.subtitle || '';
      $('tSoon').textContent = v.guestArmed ? '有 请 嘉 宾 揭 晓' : '即 将 揭 晓';
      if (cur.mode === 'title' && cur.awardId !== v.award.id) $('s-title').classList.remove('active');
      show('s-title'); cur = { mode: 'title', awardId: v.award.id }; return;
    }
    if (v.mode === 'reveal') {
      const sameAward = cur.mode === 'reveal' && cur.awardId === v.award.id && cur.total === v.award.total;
      const isUndo = sameAward && v.winners.length < cur.shown;   // 撤销：静默回退
      if (!sameAward || isUndo) {
        $('rTitle').textContent = v.award.title; $('rSub').textContent = v.award.subtitle || '';
        buildGrid(v);
        cur = { mode: 'reveal', awardId: v.award.id, shown: 0, total: v.award.total };
      }
      const cards = $('grid').children;
      const from = cur.shown, to = v.winners.length;
      const animate = booted && !isUndo;                            // 首次打开 / 刷新页面时不放动画
      for (let i = from; i < to; i++) {
        const delay = (i - from) * (to - from > 1 ? 140 : 0);
        if (animate) setTimeout(() => fillCard(cards[i], v.winners[i], true), delay);
        else fillCard(cards[i], v.winners[i], false);
      }
      if (to > from && animate) setTimeout(() => burst(to - from > 1 ? 260 : 180), 250);
      cur.shown = to;
      show('s-reveal');
    }
  }

  /* ---------- 连接 ---------- */
  let booted = false;
  function connect() {
    const es = new EventSource('/api/display/stream?k=' + encodeURIComponent(KEY) + (PREVIEW ? '&preview=1' : '') + (qs.get('name') ? '&name=' + encodeURIComponent(qs.get('name')) : ''));
    es.onopen = () => $('conn').classList.remove('show');
    es.onmessage = e => {
      const v = JSON.parse(e.data);
      render(v);
      booted = true;
    };
    es.onerror = () => { $('conn').classList.add('show'); }; // EventSource 会自动重连，画面保持不变
  }
  connect();
})();
</script>
</body>
