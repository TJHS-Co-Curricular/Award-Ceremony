<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="/assets/img/icon.svg">
<title>Award Display</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/display.css">
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="frame"></div>

  <section class="scene" id="s-standby">
    <canvas id="goldfx" width="1920" height="1080"></canvas>
    <div class="en" id="evSub"></div>
    <h1 class="goldtext" id="evTitle"></h1>
    <div class="line"><i></i><b></b><i></i></div>
  </section>

  <section class="scene" id="s-group">
    <div class="spot"></div>
    <div class="kicker">奖 项 类 别</div>
    <div class="ornament"><i></i><b></b><i></i></div>
    <h1 class="goldtext" id="gTitle"></h1>
    <div class="gsub" id="gSub"></div>
    <ol id="gList"></ol>
  </section>

  <section class="scene" id="s-title">
    <div class="spot"></div>
    <div class="gline" id="tGroup"></div>
    <div class="kicker" id="tKick">颁 发 奖 项</div>
    <h2 class="goldtext" id="tTitle"></h2>
    <div class="sub" id="tSub"></div>
    <div class="soon" id="tSoon">即 将 揭 晓</div>
  </section>

  <section class="scene" id="s-reveal">
    <header>
      <div class="gline" id="rGroup"></div>
      <h3 class="goldtext" id="rTitle"></h3>
      <div class="sub" id="rSub"></div>
      <div id="rTag"></div>
    </header>
    <div id="grid"></div>
    <div id="susp"><b class="goldtext">得主是</b><i>……</i></div>
  </section>

  <section class="scene" id="s-message">
    <p id="msg"></p>
    <div class="ornament"><i></i><b></b><i></i></div>
  </section>

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="black"></div>
</div>
<div id="conn" title="连接中断，正在重连"></div>
<!-- 脚本按顺序载入（共用同一个全局作用域）：共用 → 舞台 → 特效 → 画面 → 启动 -->
<script src="/assets/js/shared/fonts.js"></script>
<script src="/assets/js/display/stage.js"></script>
<script src="/assets/js/fx/dust.js"></script>
<script src="/assets/js/fx/flash.js"></script>
<script src="/assets/js/fx/goldriver.js"></script>
<script src="/assets/js/display/fonts.js"></script>
<script src="/assets/js/display/cards.js"></script>
<script src="/assets/js/display/nominee.js"></script>
<script src="/assets/js/display/render.js"></script>
<script src="/assets/js/display/main.js"></script>
</body>
</html>
