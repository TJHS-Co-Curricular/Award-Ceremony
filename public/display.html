<title>Award Display</title>
<style>
:root{
  --bg:#07060c; --ink:#f6f1e4; --muted:#b9ad92; --gold:#d9b25f; --gold-hi:#f7e2a6; --gold-lo:#9a7330;
  --serif:"Noto Serif SC","Source Han Serif SC","Source Han Serif CN","Songti SC","STSong","Microsoft YaHei",serif;
  --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--sans)}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:
    radial-gradient(1200px 700px at 50% 38%, rgba(217,178,95,.16), transparent 70%),
    radial-gradient(900px 500px at 50% 110%, rgba(120,40,40,.28), transparent 70%),
    linear-gradient(#0c0a14,#05040a);}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:20}
.frame{position:absolute;inset:36px;border:1px solid rgba(217,178,95,.22);pointer-events:none;z-index:5}
.frame::before,.frame::after{content:"";position:absolute;inset:10px;border:1px solid rgba(217,178,95,.10)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .9s ease, visibility 0s linear .9s;z-index:10}
.scene.active{opacity:1;visibility:visible;transition:opacity .9s ease}
.goldtext{background:linear-gradient(100deg,var(--gold-lo) 0%,var(--gold) 25%,var(--gold-hi) 45%,var(--gold) 60%,var(--gold-lo) 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-130% 0}}
.ornament{display:flex;align-items:center;gap:22px;color:var(--gold)}
.ornament i{display:block;height:1px;width:260px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.ornament b{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--gold)}
.kicker{font-size:30px;letter-spacing:.6em;padding-left:.6em;color:var(--muted);text-transform:uppercase}

/* 待机 */
/* 待机：黑金粒子光河背景；文字放在光带上方 */
#s-standby{justify-content:flex-start;padding-top:calc(var(--sh,1080px) * .13)}
#goldfx{position:absolute;inset:0;z-index:0}
#s-standby > :not(canvas){position:relative;z-index:1}
#s-standby .en{font-family:var(--serif);font-weight:500;font-size:84px;letter-spacing:.42em;padding-left:.42em;line-height:1;text-transform:uppercase;text-align:center;max-width:calc(100% - 200px);
  background:linear-gradient(180deg,#fff6d8 0%,#e9c873 45%,#9a7330 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
#s-standby .en:empty{display:none}
#s-standby h1{white-space:nowrap;font-family:var(--serif);font-weight:800;font-size:150px;letter-spacing:.08em;line-height:1.2;text-align:center;max-width:calc(100% - 220px);margin:18px 0 24px;
  filter:drop-shadow(0 0 26px rgba(255,190,70,.35)) drop-shadow(0 6px 14px rgba(0,0,0,.65))}
#s-standby .line{display:flex;align-items:center;gap:24px;color:var(--gold-hi);opacity:.85}
#s-standby .line i{display:block;height:1.5px;width:min(560px,28vw);background:linear-gradient(90deg,transparent,rgba(247,226,166,.9))}
#s-standby .line i:last-child{background:linear-gradient(270deg,transparent,rgba(247,226,166,.9))}
#s-standby .line b{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid var(--gold-hi)}

/* 分类标题（进入新分类时） */
#s-group .kicker{margin-bottom:40px}
#s-group h1{font-family:var(--serif);font-weight:800;font-size:150px;letter-spacing:.1em;line-height:1.2;text-align:center;max-width:calc(100% - 220px);margin:36px 0 18px}
#s-group .gsub{font-size:42px;letter-spacing:.42em;padding-left:.42em;color:var(--muted);text-transform:uppercase;text-align:center;max-width:calc(100% - 220px)}
#s-group ol{list-style:none;margin-top:70px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
#s-group li{display:flex;align-items:baseline;gap:30px;font-size:44px;letter-spacing:.08em}
#s-group li b{font-family:var(--serif);color:var(--gold);font-size:52px;min-width:2.4em}
#s-group li small{font-size:28px;color:var(--muted);letter-spacing:.06em}
#s-group.enter li{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
#s-group.enter li:nth-child(2){animation-delay:.12s}#s-group.enter li:nth-child(3){animation-delay:.24s}#s-group.enter li:nth-child(4){animation-delay:.36s}#s-group.enter li:nth-child(n+5){animation-delay:.48s}
#s-group.many ol{display:grid;grid-template-columns:1fr 1fr;column-gap:90px;row-gap:16px}
#s-group.many li{font-size:36px}#s-group.many li b{font-size:42px}
#s-group.nonum ol{align-items:center}#s-group.nonum li{justify-content:center}
.gline{font-size:30px;letter-spacing:.35em;padding-left:.35em;color:var(--gold);opacity:.9}
.gline:empty{display:none}
#s-title .gline{margin-bottom:26px;font-size:34px}

/* 奖项标题 */
#s-title .kicker{margin-bottom:46px}
#s-title h2{font-family:var(--serif);font-weight:800;font-size:180px;letter-spacing:.06em;line-height:1.15;text-align:center;max-width:calc(100% - 160px)}
#s-title .sub{font-size:44px;color:var(--muted);letter-spacing:.2em;margin-top:34px}
#s-title .soon{margin-top:80px;font-size:32px;letter-spacing:.8em;padding-left:.8em;color:var(--gold);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.spot{position:absolute;top:-10%;left:0;width:900px;height:120%;background:radial-gradient(closest-side,rgba(247,226,166,.10),transparent);animation:sweep 9s ease-in-out infinite alternate;pointer-events:none;will-change:transform}
@keyframes sweep{from{transform:translateX(calc(var(--sw,1920px) * -.2))}to{transform:translateX(calc(var(--sw,1920px) * .7))}}
.scene:not(.active) *{animation-play-state:paused!important}   /* 看不见的画面不跑动画 */
.scene.enter h2,.scene.enter h1{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both, shimmer 7s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

/* 揭晓 */
#s-reveal{justify-content:flex-start;padding:84px 110px 90px}
#s-reveal header{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:34px;flex:none}
#s-reveal header h3{font-family:var(--serif);font-weight:800;font-size:84px;letter-spacing:.08em;line-height:1.15;text-align:center}
#s-reveal header .sub{font-size:28px;color:var(--muted);letter-spacing:.25em}
#grid{flex:1;width:100%;display:grid;gap:var(--gap,28px);align-content:center;justify-content:center;min-height:0}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:18px 20px;border-radius:6px;min-width:0;min-height:0;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid rgba(217,178,95,.35);box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)}
.card::after{content:"";position:absolute;inset:6px;border:1px solid rgba(217,178,95,.12);border-radius:3px;pointer-events:none}
.card .tx{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}

/* 照片奖项：整张 3:2 照片做卡片，名字 / 班级 / 学号叠在左边（拍照时左边是灰色幕布，人站在右边） */
#grid.photo{display:flex;flex-wrap:wrap;justify-content:center;align-content:center}   /* 用 flex：最后一行不满时居中 */
#grid.photo .card{flex:none;width:var(--cw);height:var(--ch);padding:0;border-color:rgba(217,178,95,.55)}
#grid.photo .card::after{inset:0;border:1px solid rgba(217,178,95,.35);border-radius:6px;z-index:3}
.card .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .45s ease}
.card .ph.ok{opacity:1}
.card .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,6,12,.72) 0%,rgba(8,6,12,.5) 30%,rgba(8,6,12,.18) 48%,transparent 58%)}
.card.nopic{background:linear-gradient(90deg,#55535a 0%,#7c7a80 51%,#a57a22 52%,#c79530 100%)}   /* 没有照片：模拟灰 / 金幕布 */
#grid.photo .card .tx{position:absolute;z-index:2;left:6%;top:0;bottom:0;width:41%;justify-content:center;align-items:flex-start;text-align:left}
#grid.photo .card .nm{font-size:var(--name,72px);line-height:1.15;letter-spacing:.08em;text-shadow:0 2px 12px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5)}
#grid.photo .card .rule{width:2.6em;height:max(2px,.09em);margin:.42em 0 .5em;font-size:var(--name,72px);background:linear-gradient(90deg,var(--gold-hi),var(--gold),transparent)}
#grid.photo .card .ln{font-size:var(--detail,30px);line-height:1.4;letter-spacing:.1em;color:var(--gold-hi);white-space:nowrap;max-width:100%;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#grid.photo .card .ln.sid{font-variant-numeric:tabular-nums;letter-spacing:.14em;color:#efe6cf}
#grid.photo .card.pop::before{z-index:4}
/* 有团体的奖项（.cap）：照片完整居中在上，名字等在照片下面 */
#grid.photo.cap .card{display:flex;flex-direction:column;justify-content:flex-start;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
#grid.photo.cap .card .phbox{position:relative;flex:none;width:100%;aspect-ratio:3/2;overflow:hidden;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(217,178,95,.45)}
#grid.photo.cap .card .phbox.nopic{background:radial-gradient(120% 90% at 50% 35%,#a9822f,#3e3016)}
#grid.photo.cap .card .shade{display:none}
#grid.photo.cap .card .tx{position:static;flex:1;width:100%;padding:0 6%;justify-content:center;align-items:center;text-align:center}
#grid.photo.cap .card .nm{text-shadow:none}
#grid.photo.cap .card .rule{width:3em;margin:.28em 0 .32em;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent)}
#grid.photo.cap .card .lns{display:flex;flex-wrap:wrap;justify-content:center;gap:0 .9em;max-width:100%}
#grid.photo.cap .card .ln{text-shadow:none}
#grid.photo .card .ln.note{color:var(--muted);font-size:calc(var(--detail,30px) * .85)}
#s-reveal.dense{padding-top:60px;padding-bottom:64px}
#s-reveal.dense header{margin-bottom:18px;gap:4px}
#s-reveal.dense header h3{font-size:60px}
#s-reveal.dense header .sub{font-size:22px}
.card .nm{font-family:var(--namef,inherit);font-weight:800;font-size:var(--name,72px);line-height:1.2;letter-spacing:.06em;color:var(--ink);white-space:nowrap;max-width:100%}
.card .dt{font-size:var(--detail,30px);color:var(--muted);margin-top:.45em;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card.hidden{border-style:dashed;border-color:rgba(217,178,95,.22);background:rgba(255,255,255,.015);box-shadow:none}
.card.hidden .q{font-family:var(--serif);font-size:calc(var(--name,72px) * 1.1);color:rgba(217,178,95,.35);animation:pulse 2.4s ease-in-out infinite}
.card.pop{animation:pop 1.1s cubic-bezier(.2,.8,.2,1) both}
.card.pop::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.45) 50%,transparent 70%);transform:translateX(-120%);animation:glint 1.4s .35s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotateX(70deg);filter:blur(10px)}60%{opacity:1;transform:scale(1.04);filter:none}100%{transform:none}}
@keyframes glint{to{transform:translateX(120%)}}
.single .card{border-color:rgba(217,178,95,.6)}

/* 入围揭晓：介绍入围者 → 悬念 → 得主放大到中央，其他人变暗留在后面 */
#rTag{font-size:26px;letter-spacing:.6em;padding-left:.6em;color:var(--gold);margin-top:6px}
#rTag:empty{display:none}
#s-reveal .card{transition:transform 1s cubic-bezier(.2,.8,.2,1),filter .7s ease,opacity .7s ease,box-shadow .7s ease}
#grid.noanim .card,#grid.noanim + #susp{transition:none!important}
#s-reveal.suspense #grid .card{filter:brightness(.42) saturate(.6)}
#s-reveal.crowned #grid .card:not(.win){filter:brightness(.32) grayscale(.55);transform:scale(.92)}
#s-reveal.crowned #grid .card.win{z-index:30;background-color:#16131c;transform:translate(var(--wx,0),var(--wy,0)) scale(var(--ws,1.3));border-color:var(--gold-hi);
  box-shadow:0 0 0 3px rgba(247,226,166,.9),0 0 90px rgba(247,226,166,.45),0 30px 80px rgba(0,0,0,.6)}
.card .badge{position:absolute;z-index:6;left:50%;top:0;transform:translate(-50%,-50%) scale(0);padding:.25em 1.1em;border-radius:99px;white-space:nowrap;
  font:800 var(--badge,28px)/1.3 var(--serif);letter-spacing:.3em;color:#1a1405;background:linear-gradient(100deg,var(--gold-lo),var(--gold-hi),var(--gold));
  box-shadow:0 6px 24px rgba(0,0,0,.5);transition:transform .6s .5s cubic-bezier(.3,1.6,.5,1)}
#s-reveal.crowned .card.win{overflow:visible}
#s-reveal.crowned .card.win .badge{transform:translate(-50%,-50%) scale(1)}
#susp{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);z-index:25;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease}
#susp b{display:block;font-family:var(--serif);font-weight:800;font-size:150px;letter-spacing:.2em;padding-left:.2em}
#susp i{display:block;font-style:normal;font-size:60px;letter-spacing:.5em;color:var(--gold-hi);animation:pulse 1.6s ease-in-out infinite}
#s-reveal.suspense #susp{opacity:1}

/* 消息 */
#s-message p{font-family:var(--serif);font-weight:700;font-size:110px;line-height:1.35;text-align:center;max-width:calc(100% - 270px);letter-spacing:.06em;white-space:pre-wrap}
#s-message .ornament{margin-top:60px}

#black{position:absolute;inset:0;background:#000;z-index:50;opacity:0;pointer-events:none;transition:opacity .7s ease}
#black.on{opacity:1}
#conn{position:fixed;right:10px;bottom:10px;width:10px;height:10px;border-radius:50%;background:#e04848;z-index:100;opacity:0;transition:opacity .3s}
#conn.show{opacity:.85}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="frame"></div>

  <section class="scene" id="s-standby">
    <canvas id="goldfx" width="1920" height="1080"></canvas>
    <div class="en" id="evSub"></div>
    <h1 class="goldtext" id="evTitle"></h1>
    <div class="line"><i></i><b></b><i></i></div>
  </section>

  <section class="scene" id="s-group">
    <div class="spot"></div>
    <div class="kicker">奖 项 类 别</div>
    <div class="ornament"><i></i><b></b><i></i></div>
    <h1 class="goldtext" id="gTitle"></h1>
    <div class="gsub" id="gSub"></div>
    <ol id="gList"></ol>
  </section>

  <section class="scene" id="s-title">
    <div class="spot"></div>
    <div class="gline" id="tGroup"></div>
    <div class="kicker" id="tKick">颁 发 奖 项</div>
    <h2 class="goldtext" id="tTitle"></h2>
    <div class="sub" id="tSub"></div>
    <div class="soon" id="tSoon">即 将 揭 晓</div>
  </section>

  <section class="scene" id="s-reveal">
    <header>
      <div class="gline" id="rGroup"></div>
      <h3 class="goldtext" id="rTitle"></h3>
      <div class="sub" id="rSub"></div>
      <div id="rTag"></div>
    </header>
    <div id="grid"></div>
    <div id="susp"><b class="goldtext">得主是</b><i>……</i></div>
  </section>

  <section class="scene" id="s-message">
    <p id="msg"></p>
    <div class="ornament"><i></i><b></b><i></i></div>
  </section>

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="black"></div>
</div>
<div id="conn" title="连接中断，正在重连"></div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const KEY = qs.get('k') || '';
  const PREVIEW = qs.get('preview') === '1';
  const $ = id => document.getElementById(id);

  /* ---------- 舞台：按屏幕比例自适应 ----------
   * 以 1920×1080 为基准单位，短边固定、长边延伸：
   *   4096×1280 → 舞台 3456×1080（超宽）；1216×896 → 舞台 1920×1415（偏方）
   * 网址加 &res=宽x高 可强制比例（例如经过视频处理器、窗口大小不准时）。 */
  const stage = $('stage');
  let SW = 1920, SH = 1080, lastV = null, resizeT = 0;
  const RES = (qs.get('res') || '').match(/^(\d{2,5})x(\d{2,5})$/);

      if (!best || cw > best.cw + .5) best = { cols, rows, gap, cw, ch: cw / AR };
    }
    return best && best.cw >= 150 ? best : null;   // 太小就退回纯文字
  }
  function fitText(el) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 40;
    while (el.scrollWidth > el.clientWidth + 1 && size > 12 && guard--) { size *= .92; el.style.fontSize = size + 'px'; }
  }
  const div = (cls, text) => { const d = document.createElement('div'); d.className = cls; if (text != null) d.textContent = text; return d; };
  function fillCard(card, w, animate) {
    card.className = 'card' + (animate ? ' pop' : '') + (w.type === 'team' ? ' team' : '');
    card.textContent = '';
    const tx = div('tx');
    const nm = div('nm', w.name); tx.appendChild(nm);
    const fits = [nm];
    const grid = $('grid');
    if (grid.classList.contains('photo')) {
      const cap = grid.classList.contains('cap');         // cap：照片在上、名字在下；否则照片铺满、左侧叠字
      const holder = cap ? card.appendChild(div('phbox')) : card;
      if (w.photo) {
        const img = document.createElement('img');
        img.className = 'ph'; img.alt = ''; img.decoding = 'async';
        img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => img.classList.add('ok'));
        img.src = w.photo + '&k=' + encodeURIComponent(KEY);
        holder.appendChild(img);
      } else holder.classList.add('nopic');
      if (!cap) card.appendChild(div('shade'));
      if (w.cls || w.sid || w.detail) tx.appendChild(div('rule'));
      const box = cap ? tx.appendChild(div('lns')) : tx;  // 名字在下：班级 / 学号 / 备注排成一行（可换行）
      for (const [k, t] of [['cls', w.cls], ['sid', w.sid], ['note', w.detail]]) if (t) { const d = box.appendChild(div('ln ' + k, t)); if (!cap) fits.push(d); }
    } else {                                              // 纯文字卡：班级 · 学号 · 备注 合成一行
      const info = [w.cls, w.sid, w.detail].filter(Boolean).join(' · ');
      if (info) tx.appendChild(div('dt', info));
    }
    card.appendChild(tx);
    requestAnimationFrame(() => fits.forEach(fitText));
  }
  function buildGrid(v) {
    const grid = $('grid');
    const n = v.award.total;
    grid.textContent = '';
    grid.className = '';
    grid.removeAttribute('style');
    grid.classList.toggle('single', n === 1);
    $('s-reveal').classList.remove('dense');
    const shrink = v.award.nominee && n > 1 ? .74 : 1;   // 入围：卡片先小一点，得主揭晓时才有放大的空间
    if (v.award.hasPhotos && buildPhotoGrid(grid, n, !!v.award.hasTeams, shrink)) return;
    const T = planText(n, grid.clientWidth || SW - 220, (grid.clientHeight || SH - 300) * shrink);
    grid.style.setProperty('--name', Math.floor(T.name) + 'px');
    grid.style.setProperty('--detail', Math.max(12, Math.floor(T.name * .38)) + 'px');
    grid.style.setProperty('--gap', T.gap + 'px');
    grid.style.gridTemplateColumns = `repeat(${T.cols}, ${Math.floor(T.cw)}px)`;
    grid.style.gridTemplateRows = `repeat(${T.rows}, ${Math.floor(n <= 3 ? Math.min(T.ch, 380) : T.ch)}px)`;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'card hidden';
      c.innerHTML = '<div class="q">?</div>';
      grid.appendChild(c);
    }
  }
  function buildPhotoGrid(grid, n, cap, shrink = 1) {
    const scene = $('s-reveal');
    scene.classList.toggle('dense', n > 12);
    const W = grid.clientWidth || SW - 220, H = (grid.clientHeight || SH - 300) * shrink;
    const P = planPhoto(n, W, H, cap ? 1 / (1 / PHOTO_AR + CAP_H) : PHOTO_AR);
    if (!P) { scene.classList.remove('dense'); return false; }   // 人数实在太多：只显示名字
    grid.classList.add('photo');
    if (cap) grid.classList.add('cap');                         // 奖项里有团体：全部改成「照片在上、名字在下」
    const s = grid.style;
    const name = Math.max(16, Math.min(P.cw * (cap ? .07 : .078), 150));   // 字号跟着卡片宽度走
    s.setProperty('--name', Math.floor(name) + 'px');
    s.setProperty('--detail', Math.max(12, Math.floor(name * .52)) + 'px');
    s.setProperty('--gap', P.gap + 'px');
    s.setProperty('--cw', Math.floor(P.cw) + 'px');
    s.setProperty('--ch', Math.floor(P.ch) + 'px');
    s.maxWidth = (P.cols * Math.floor(P.cw) + (P.cols - 1) * P.gap + 1) + 'px';   // 每行刚好放 cols 张
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'card hidden';
      c.innerHTML = '<div class="q">?</div>';
      grid.appendChild(c);
    }
    return true;
  }
  function applyPhase(v, animate, celebrate, wait = 0) {
    const sc = $('s-reveal'), grid = $('grid'), nom = !!v.award.nominee, ph = nom ? v.award.phase || '' : '';
    if (!animate) { grid.classList.add('noanim'); requestAnimationFrame(() => requestAnimationFrame(() => grid.classList.remove('noanim'))); }
    sc.classList.toggle('suspense', ph === 'suspense');
    $('rTag').textContent = nom && ph !== 'winner' ? '入 围 名 单' : '';
    const cards = [...grid.children];
    for (const c of cards) if (c.classList.contains('win') && (ph !== 'winner' || cards.indexOf(c) !== v.award.winnerIndex)) c.classList.remove('win');
    if (ph !== 'winner') { sc.classList.remove('crowned'); return; }
    // 卡片还在逐张弹出（例如直接「全部揭晓」）时，等它们出完再放大得主，免得被 fillCard 覆盖
    if (wait) return setTimeout(() => { if (lastV?.award?.id === v.award.id && lastV.award.phase === 'winner') crown(v, cards, celebrate); }, wait);
    crown(v, cards, celebrate);
  }
  function crown(v, cards, celebrate) {
    const grid = $('grid');
    $('s-reveal').classList.add('crowned');
    const c = cards[v.award.winnerIndex];
    if (!c) return;
    c.classList.remove('pop');                       // pop 动画会锁住 transform，先拿掉
    if (!c.querySelector('.badge')) { const b = div('badge', '🏆 得 主'); c.appendChild(b); }
    // 把得主卡移到网格中央并放大（offsetLeft 等不受 transform 影响，和舞台缩放无关）
    const gw = grid.clientWidth, gh = grid.clientHeight, cw = c.offsetWidth, chh = c.offsetHeight;
    const ws = Math.max(1.08, Math.min(1.9, gw * .9 / cw, (gh * .94) / chh));
    c.style.setProperty('--wx', (grid.offsetLeft + gw / 2 - (c.offsetLeft + cw / 2)) + 'px');
    c.style.setProperty('--wy', (grid.offsetTop + gh / 2 - (c.offsetTop + chh / 2)) + 'px');
    c.style.setProperty('--ws', ws.toFixed(3));
    c.style.setProperty('--badge', Math.max(14, Math.round(cw * .045)) + 'px');
    c.classList.add('win');
    if (celebrate) setTimeout(() => burst(320), 650);
  }
  function relayout() {           // 屏幕比例变了：静默重排当前画面（不放动画）
    if (!lastV) return;
    $('evTitle').dataset.w = '';   // 字体或尺寸变了：标题重新缩放
    const b = booted; booted = false; cur = { mode: null }; render(lastV); booted = b;
  }
  function render(v) {
    lastV = v;
    applyFonts(v.event);
    $('black').classList.toggle('on', !!v.blackout);
    if ($('evTitle').textContent !== (v.event?.title || '') || $('evTitle').dataset.w !== String(SW)) {   // 标题太长就缩小，保持一行
      const h = $('evTitle'); h.textContent = v.event?.title || ''; h.style.fontSize = ''; h.dataset.w = SW;
      requestAnimationFrame(() => fitText(h));
    }
    $('evSub').textContent = v.event?.subtitle || '';

    if (v.mode === 'standby') { show('s-standby'); cur = { mode: 'standby' }; return; }
    if (v.mode === 'message') {
      if (cur.mode !== 'message' || $('msg').textContent !== v.message) {
        $('msg').textContent = v.message || '';
        $('s-message').classList.remove('active');
      }
      show('s-message'); cur = { mode: 'message' }; return;
    }
    if (v.mode === 'group' && v.group) {
      const key = v.group.title + '|' + (v.group.noNum ? 1 : 0) + '|' + v.group.awards.map(x => x.title).join('|');
      if (cur.mode === 'group' && cur.key !== key) $('s-group').classList.remove('active');   // 换了分类：重新进场
      $('gTitle').textContent = v.group.title; $('gSub').textContent = v.group.sub || '';
      const ol = $('gList'); ol.textContent = '';
      v.group.awards.forEach((x, i) => {
        const li = document.createElement('li');
        li.innerHTML = '<b></b><span></span><small></small>';
        li.children[0].textContent = String(i + 1).padStart(2, '0'); li.children[1].textContent = x.title; li.children[2].textContent = x.subtitle || '';
        if (v.group.noNum) li.children[0].remove();   // 这一类设定为不显示编号
        ol.appendChild(li);
      });
      $('s-group').classList.toggle('many', v.group.awards.length > 5);
      $('s-group').classList.toggle('nonum', !!v.group.noNum);
      show('s-group'); cur = { mode: 'group', key }; return;
    }
    const gl = v.award?.group ? `${v.award.group}${v.award.groupTotal > 1 && !v.award.groupNoNum ? ' · 奖项 ' + String(v.award.groupIndex).padStart(2, '0') : ''}` : '';
    $('tGroup').textContent = gl; $('rGroup').textContent = gl;
    if (v.mode === 'title') {
      $('tTitle').textContent = v.award.title; $('tSub').textContent = v.award.subtitle || '';
      $('tSoon').textContent = v.guestArmed ? '有 请 嘉 宾 揭 晓' : '即 将 揭 晓';
      if (cur.mode === 'title' && cur.awardId !== v.award.id) $('s-title').classList.remove('active');
      show('s-title'); cur = { mode: 'title', awardId: v.award.id }; return;
    }
    if (v.mode === 'reveal') {
      const sameAward = cur.mode === 'reveal' && cur.awardId === v.award.id && cur.total === v.award.total;
      const isUndo = sameAward && v.winners.length < cur.shown;   // 撤销：静默回退
      if (!sameAward || isUndo) {
        $('rTitle').textContent = v.award.title; $('rSub').textContent = v.award.subtitle || '';
        buildGrid(v);
        cur = { mode: 'reveal', awardId: v.award.id, shown: 0, total: v.award.total };
      }
      const cards = $('grid').children;
      const from = cur.shown, to = v.winners.length;
      const animate = booted && !isUndo;                            // 首次打开 / 刷新页面时不放动画
      for (let i = from; i < to; i++) {
        const delay = (i - from) * (to - from > 1 ? 140 : 0);
        if (animate) setTimeout(() => fillCard(cards[i], v.winners[i], true), delay);
        else fillCard(cards[i], v.winners[i], false);
      }
      if (to > from && animate) setTimeout(() => burst(to - from > 1 ? 260 : 180), 250);
      cur.shown = to;
      show('s-reveal');
      const ph = v.award.nominee ? v.award.phase || '' : '';
      if (ph !== cur.phase || !sameAward || isUndo) {
        const anim = animate && !isUndo;
        applyPhase(v, anim, anim && ph === 'winner' && cur.phase !== 'winner', anim && to > from ? (to - from - 1) * 140 + 450 : 0);
      }
      cur.phase = ph;
    }
  }

  /* ---------- 连接 ---------- */
  let booted = false;
  function connect() {
    const es = new EventSource('/api/display/stream?k=' + encodeURIComponent(KEY) + (PREVIEW ? '&preview=1' : '') + (qs.get('name') ? '&name=' + encodeURIComponent(qs.get('name')) : ''));
    es.onopen = () => $('conn').classList.remove('show');
    es.onmessage = e => {
      const v = JSON.parse(e.data);
      render(v);
      booted = true;
    };
    es.onerror = () => { $('conn').classList.add('show'); }; // EventSource 会自动重连，画面保持不变
  }
  connect();
})();
</script>
</body>
</html>
